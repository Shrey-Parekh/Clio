<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src ws://127.0.0.1:8765" />
<title>Clio</title>
<style>
  :root {
    --ink:#05060A; --slab:#0E1014; --rule:#14171C;
    --bone:#EDE8DE; --ash:#7B7F86; --dim:#4E535A;
    --sodium:#F0A83C; --rust:#A85A44; --cool:#9FB4BC;
    --chrome:Bahnschrift,'Segoe UI Variable Small','Segoe UI',system-ui,sans-serif;
    --speech:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    margin:0; background:var(--ink); color:var(--bone);
    font-family:var(--speech); user-select:none;
    display:flex; flex-direction:column;
  }
  .chrome { font-family:var(--chrome); text-transform:uppercase; }
  header {
    flex:none; height:36px; padding:0 14px; display:flex; align-items:center;
    justify-content:space-between; border-bottom:1px solid var(--rule);
    -webkit-app-region:drag;
  }
  .brand { display:flex; align-items:center; gap:9px; }
  #dot { width:5px; height:5px; border-radius:50%; background:var(--dim); transition:background .3s; }
  .word { font:600 10px/1 var(--chrome); letter-spacing:.34em; color:var(--bone); }
  #link { font:400 9px/1 var(--chrome); letter-spacing:.18em; color:#5B6068; text-transform:uppercase; }

  #stage { position:relative; flex:1; min-height:0; }
  clio-lattice { position:absolute; inset:0; }
  #readout { position:absolute; left:0; right:0; bottom:0; padding:0 18px 16px; pointer-events:none; }
  .cap { font:400 9px/1 var(--chrome); letter-spacing:.3em; color:#5B6068; margin-bottom:9px; }
  #state { font:600 38px/0.9 Bahnschrift,'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;
           letter-spacing:.05em; text-transform:uppercase; color:var(--bone); transition:color .35s; }
  #track { margin-top:12px; height:1px; background:#1B1F25; position:relative; }
  #meter { position:absolute; left:0; top:0; height:1px; width:18%; background:var(--bone); transition:width .28s ease, background .35s; }
  #note { margin-top:8px; font:400 9.5px/1.5 var(--chrome); letter-spacing:.14em; color:#5B6068; text-transform:uppercase; }

  #turns { flex:none; border-top:1px solid var(--rule); padding:13px 18px 14px; display:flex; flex-direction:column; gap:11px; }
  .turn { display:flex; gap:12px; align-items:baseline; }
  .turn .tag { flex:none; width:32px; font:400 8.5px/1.4 var(--chrome); letter-spacing:.22em; }
  .turn .txt { flex:1; min-width:0; font:400 12.5px/1.45 var(--speech); overflow:hidden;
               display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; user-select:text; }
  #you .tag { color:var(--dim); } #you .txt { color:#8B9099; }
  #clio .tag { color:#8A6528; } #clio .txt { color:#E0A44A; font-size:13px; -webkit-line-clamp:3; }

  footer { flex:none; height:30px; padding:0 18px; display:flex; align-items:center;
           justify-content:space-between; border-top:1px solid var(--rule); background:#090A0D; }
  footer div { font:400 8.5px/1 var(--chrome); letter-spacing:.2em; color:#464B52; }
  #mic { color:#464B52; }
  :focus-visible { outline:1px solid var(--sodium); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

  /* --- window controls, since there is no title bar --- */
  .controls { display:flex; align-items:center; gap:2px; }
  .controls button {
    appearance:none; background:none; border:0; width:22px; height:22px; padding:0;
    display:grid; place-items:center; cursor:pointer; color:#5B6068; border-radius:3px;
    font:400 11px/1 var(--chrome); transition:color .15s, background .15s;
  }
  .controls button:hover { color:var(--bone); background:#171A20; }
  .controls button[data-win="close"]:hover { color:#E8836A; background:#231413; }
  .controls button[aria-pressed="true"] { color:var(--sodium); }
  .controls svg { width:11px; height:11px; fill:none; stroke:currentColor; stroke-width:1.4; }

  /* Invisible strips over the edges; window.js turns a press into a resize. */
  .win-grip { background:transparent; }

  /* --- adapting to the window, not the screen ---------------------------
     window.js puts data-width / data-height on <html>, so these react to the
     window being dragged smaller, which is what actually changes here. */
  #state { font-size:clamp(20px, 8.5vw, 44px); }
  #readout { padding:0 clamp(10px, 4vw, 22px) clamp(10px, 3.5vh, 18px); max-width:760px; }
  #turns { padding:clamp(8px, 2vh, 14px) clamp(10px, 4vw, 20px); gap:clamp(6px, 1.4vh, 12px); }
  .turn .txt { font-size:clamp(11px, 1.1vw + 9px, 14px); }

  /* Short: the conversation and the footer go first - the state is the point. */
  html[data-height="short"] #turns,
  html[data-height="short"] footer { display:none; }
  html[data-height="short"] .cap { display:none; }
  html[data-height="short"] #note { margin-top:5px; }

  /* Narrow: drop the letter-spaced chrome text that wraps badly. */
  html[data-width="tiny"] #link,
  html[data-width="tiny"] footer div:first-child { display:none; }
  html[data-width="tiny"] header { padding:0 8px; }
  html[data-width="narrow"] .turn .tag { width:26px; }

  /* Wide or fullscreen: keep the readout readable instead of stretched. */
  html[data-width="wide"] #turns { padding-left:clamp(20px, 6vw, 80px); padding-right:clamp(20px, 6vw, 80px); }
  html[data-width="wide"] #readout { padding-left:clamp(20px, 6vw, 80px); }
  html[data-fullscreen] header { height:44px; }

  /* --- window controls, since there is no title bar --- */
  .controls { display:flex; align-items:center; gap:2px; }
  .controls button {
    appearance:none; background:none; border:0; width:22px; height:22px; padding:0;
    display:grid; place-items:center; cursor:pointer; color:#5B6068; border-radius:3px;
    font:400 11px/1 var(--chrome); transition:color .15s, background .15s;
  }
  .controls button:hover { color:var(--bone); background:#171A20; }
  .controls button[data-win="close"]:hover { color:#E8836A; background:#231413; }
  .controls button[aria-pressed="true"] { color:var(--sodium); }
  .controls svg { width:11px; height:11px; fill:none; stroke:currentColor; stroke-width:1.4; }

  /* Invisible strips over the edges; window.js turns a press into a resize. */
  .win-grip { background:transparent; }

  /* --- adapting to the window, not the screen ---------------------------
     window.js puts data-width / data-height on <html>, so these react to the
     window being dragged smaller, which a media query on the viewport cannot
     do reliably inside a frameless webview. */
  #state { font-size:clamp(20px, 8.5vw, 44px); }
  #readout { padding:0 clamp(10px, 4vw, 22px) clamp(10px, 3.5vh, 18px); max-width:760px; }
  #turns { padding:clamp(8px, 2vh, 14px) clamp(10px, 4vw, 20px); gap:clamp(6px, 1.4vh, 12px); }
  .turn .txt { font-size:clamp(11px, 1.1vw + 9px, 14px); }

  /* Short: the conversation and the footer go first - the state is the point. */
  html[data-height="short"] #turns,
  html[data-height="short"] footer { display:none; }
  html[data-height="short"] .cap { display:none; }
  html[data-height="short"] #note { margin-top:5px; }

  /* Narrow: drop the letter-spaced chrome text that wraps badly. */
  html[data-width="tiny"] #link,
  html[data-width="tiny"] footer div:first-child { display:none; }
  html[data-width="tiny"] header { padding:0 8px; }
  html[data-width="narrow"] .turn .tag { width:26px; }

  /* Wide or fullscreen: keep the readout readable instead of stretched. */
  html[data-width="wide"] #turns { padding-left:clamp(20px, 6vw, 80px); padding-right:clamp(20px, 6vw, 80px); }
  html[data-width="wide"] #readout { padding-left:clamp(20px, 6vw, 80px); }
  html[data-fullscreen] header { height:44px; }
  html[data-maximised] .controls button[data-win="maximise"] svg .restore { display:block; }
  html:not([data-maximised]) .controls button[data-win="maximise"] svg .restore { display:none; }
</style>
</head>
<body>
  <header data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <div id="dot"></div><div class="word" data-tauri-drag-region>CLIO</div>
    </div>
    <div id="link" class="chrome" data-tauri-drag-region>connecting…</div>
    <div class="controls">
      <button data-win="pin" title="Always on top" aria-pressed="true" aria-label="Always on top">
        <svg viewBox="0 0 12 12"><path d="M6 1.5v9M2.5 5h7"/></svg>
      </button>
      <button data-win="minimise" title="Minimise (Ctrl+M)" aria-label="Minimise">
        <svg viewBox="0 0 12 12"><path d="M2 6.5h8"/></svg>
      </button>
      <button data-win="maximise" title="Maximise" aria-label="Maximise">
        <svg viewBox="0 0 12 12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1"/></svg>
      </button>
      <button data-win="fullscreen" title="Fullscreen (F11)" aria-label="Fullscreen">
        <svg viewBox="0 0 12 12"><path d="M2 4.4V2h2.4M7.6 2H10v2.4M10 7.6V10H7.6M4.4 10H2V7.6"/></svg>
      </button>
      <button data-win="close" title="Hide — Clio keeps listening" aria-label="Hide">
        <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg>
      </button>
    </div>
  </header>

  <div id="stage">
    <clio-lattice state="offline"></clio-lattice>
    <div id="readout">
      <div class="cap chrome">STATE</div>
      <div id="state">No core</div>
      <div id="track"><div id="meter"></div></div>
      <div id="note" class="chrome">Reconnecting to 8765</div>
    </div>
  </div>

  <div id="turns">
    <div class="turn" id="you"><div class="tag chrome">YOU</div><div class="txt">Nothing heard yet.</div></div>
    <div class="turn" id="clio"><div class="tag chrome">CLIO</div><div class="txt">I am here when you are.</div></div>
  </div>

  <footer>
    <div>“HEY CLIO” · CTRL+ALT+C</div>
    <div id="mic">MIC LIVE</div>
  </footer>

<script src="lattice.js"></script>
<script src="clio-bus.js"></script>
<script src="window.js"></script>
<script src="hud.js"></script>
</body>
</html>
