# Non-secret defaults. Secrets (API keys) live in .env, never here.
# Any value here can be overridden by the matching CLIO_* env var - see .env.example.

[llm]
# Free, no billing: Groq (cloud) as primary, a local Ollama model as offline fallback.
# Provider must match one of the secrets in .env: groq -> GROQ_API_KEY, gemini -> GEMINI_API_KEY.
provider = "groq"
# Three tiers, picked per task rather than one model for everything.
# A tier is (model + reasoning effort). Benchmarked Sept 2026 - see docs note below.
model_fast = "openai/gpt-oss-20b"           # routing decisions, simple lookups, low-stakes classification
model_default = "openai/gpt-oss-120b"       # general conversation, most tool calls - what gets spoken
model_reasoning = "openai/gpt-oss-120b"     # multi-step planning, where thinking is worth the wait

# gpt-oss exposes reasoning effort as a request parameter, and keeps its reasoning in a
# separate field rather than inline <think> tags - so nothing has to be stripped before
# the text is spoken. qwen/qwen3.6-27b was the original default and was dropped: it emitted
# 848+ chars of inline <think> for a one-line answer, which breaks streaming TTS.
effort_fast = "low"
effort_default = "low"
effort_reasoning = "high"
# Used when Groq is unreachable or the network is down - runs entirely on this machine.
local_fallback_model = "qwen3:8b"
local_fallback_host = "http://localhost:11434"

[speech]
tts_engine = "kokoro"     # edge | kokoro | elevenlabs | gemini
tts_voice = "af_heart"    # picked from a 12-way comparison (5 sentences x 7 Edge/Kokoro voices, then +9 more Kokoro af_* voices)
stt_provider = "local"    # local | groq - benchmarked equal accuracy (clean and at 5dB SNR),
                          # local is free/private/offline and doesn't burn Groq rate limits.
                          # groq is ~equally fast (0.22s vs 0.26s mean) if the GPU is busy elsewhere.
stt_model = "small.en"    # faster-whisper size: tiny | base | small | medium | large-v3
stt_device = "cuda"       # cuda | cpu
stt_groq_model = "whisper-large-v3-turbo"
# Relative paths resolve against the project root; not committed, see .gitignore.
kokoro_model_path = "models/kokoro-v1.0.fp16-gpu.onnx"
kokoro_voices_path = "models/voices-v1.0.bin"

[audio]
# Silero VAD, 16kHz variant, no torch dependency - raw ONNX + onnxruntime, same
# pattern as Kokoro. Not committed, see .gitignore.
vad_model_path = "models/silero_vad_16k.onnx"
vad_threshold = 0.5          # >= this speech probability counts as "speaking"
vad_min_speech_ms = 250      # continuous speech needed before a turn is confirmed started
vad_end_silence_ms = 700     # continuous silence needed before a turn is considered ended

[wake_word]
# "Daddy is home Clio" was dropped - it failed training twice at the identical score,
# a repeat rather than noise. Likely too long/sentence-shaped for openWakeWord's embedding
# window, which appears tuned for short 1-3 word phrases. See docs/wake_word_training.md.
phrases = [
    "Hey Clio",
    "Hi Clio",
    "Hello Clio",
    "Good morning Clio",
    "Clio wake up",
]
threshold = 0.4
models_dir = "models/wake_words"

[persona]
name = "default"

[runtime]
log_level = "INFO"        # DEBUG | INFO | WARNING | ERROR
core_port = 8765
