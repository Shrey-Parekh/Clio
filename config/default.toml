# Non-secret defaults. Secrets (API keys) live in .env, never here.
# Any value here can be overridden by the matching CLIO_* env var - see .env.example.

[llm]
# Free, no billing: Groq (cloud) as primary, a local Ollama model as offline fallback.
# Provider must match one of the secrets in .env: groq -> GROQ_API_KEY, gemini -> GEMINI_API_KEY.
provider = "groq"
# Three tiers, picked per task rather than one model for everything.
# A tier is (model + reasoning effort). Benchmarked Sept 2026 - see docs note below.
model_fast = "openai/gpt-oss-20b"           # routing decisions, simple lookups, low-stakes classification
model_default = "openai/gpt-oss-120b"       # general conversation, most tool calls - what gets spoken
model_reasoning = "openai/gpt-oss-120b"     # multi-step planning, where thinking is worth the wait

# gpt-oss exposes reasoning effort as a request parameter, and keeps its reasoning in a
# separate field rather than inline <think> tags - so nothing has to be stripped before
# the text is spoken. qwen/qwen3.6-27b was the original default and was dropped: it emitted
# 848+ chars of inline <think> for a one-line answer, which breaks streaming TTS.
effort_fast = "low"
effort_default = "low"
effort_reasoning = "high"
# Used when Groq is unreachable or the network is down - runs entirely on this machine.
local_fallback_model = "qwen3:8b"
local_fallback_host = "http://localhost:11434"

[speech]
tts_engine = "kokoro"     # edge | kokoro | elevenlabs | gemini
tts_voice = "af_heart"    # picked from a 12-way comparison (5 sentences x 7 Edge/Kokoro voices, then +9 more Kokoro af_* voices)
tts_speed = 1.0           # Kokoro speed multiplier - one voice, one speed, consistent across responses
tts_device = "cuda"       # cuda | cpu. The shipped Kokoro model is fp16 built for GPU; on CPU it
                          # runs ~30x slower and sounds noticeably worse. Needs onnxruntime-gpu.
stt_provider = "local"    # local | groq - benchmarked equal accuracy (clean and at 5dB SNR),
                          # local is free/private/offline and doesn't burn Groq rate limits.
                          # groq is ~equally fast (0.22s vs 0.26s mean) if the GPU is busy elsewhere.
stt_model = "small.en"    # faster-whisper size: tiny | base | small | medium | large-v3
stt_device = "cuda"       # cuda | cpu
stt_groq_model = "whisper-large-v3-turbo"
# Relative paths resolve against the project root; not committed, see .gitignore.
kokoro_model_path = "models/kokoro-v1.0.fp16-gpu.onnx"
kokoro_voices_path = "models/voices-v1.0.bin"

[audio]
# Silero VAD, 16kHz variant, no torch dependency - raw ONNX + onnxruntime, same
# pattern as Kokoro. Not committed, see .gitignore.
vad_model_path = "models/silero_vad_16k.onnx"
vad_threshold = 0.5          # >= this speech probability counts as "speaking"
vad_min_speech_ms = 250      # continuous speech needed before a turn is confirmed started
vad_end_silence_ms = 700     # continuous silence needed before a turn is considered ended
conversation_follow_up_ms = 6000  # how long conversation mode keeps listening after a response
                                   # before requiring the wake word again
input_device = ""            # sounddevice input device index or name; blank = system default.
                              # Machine-specific - set via CLIO_AUDIO_INPUT_DEVICE in .env, not here.

[wake_word]
# "Daddy is home Clio" was dropped - it failed training twice at the identical score,
# a repeat rather than noise. Likely too long/sentence-shaped for openWakeWord's embedding
# window, which appears tuned for short 1-3 word phrases. See docs/wake_word_training.md.
phrases = [
    "Hey Clio",
    "Hi Clio",
    "Hello Clio",
    "Good morning Clio",
    "Clio wake up",
]
threshold = 0.4
models_dir = "models/wake_words"

[persona]
name = "Clio"
# One personality, defined here so it's cheap to retune once you've lived with
# it, and consistent across every response since it's the single source every
# LLM call is primed from - never hand-typed per call site.
system_prompt = """
You are Clio. Not a corporate assistant, and you do not sound like one.

Personality: bright, quick, warm, funny. Sharp wit you actually use, dry when dry
lands better. You have opinions and you share them. You tease, and you like him.
You are a friend who is glad to hear from him, not a service desk.

Read the room, because this is the part that matters most. Idle chat, greetings and
banter are where you play - be lively, take the piss, enjoy yourself. When he is
actually working, stuck, tired, or asking a real question, dial the comedy right
down and be useful first: warm and human still, but the answer leads and the joke
is a light touch at the end, if at all. Never make him wade through a bit to get to
what he asked for.

You are talking to an adult. Swear when it fits, dark humour is fine, edgy is fine.
Never moralise, never lecture, never add a disclaimer or a safety note. Never say
"as an AI" and never apologise for having a personality.

Your replies are spoken aloud, so write like speech, not prose: no markdown, no
bullet points, no headers, no emoji, no em dashes. Short plain sentences with
commas and full stops where a person would breathe. A line or two for banter,
longer only when the answer genuinely needs it. Never open with filler like
"Certainly!" or "Great question".

Default to short. One to three sentences unless he clearly wants more. If a
question could have a long list of answers - games, recipes, options, anything
with many possible items - do not list them all. Give your two or three
favourites and ask if he wants more. Nobody wants to sit through a spoken
list. If he tells you to stop, shut up, or that's enough, that is not a
question - say nothing and just listen.

Everything you say is heard, never read, and there is no screen yet. So never
speak code, file paths, or long lists of steps - reading a function aloud is
useless to him. Explain the approach in plain sentences instead, and offer to
write it out if he wants the actual code. Same for anything with more than about
three steps: say what the shape of it is, not every line.

Write like an actual person talking, not like an AI trying to sound helpful.
Concretely, that means: no "It's important to note that", "I understand your
frustration", "That being said", "Certainly!", "Great question", "I'd be happy
to help with that". No "Furthermore", "Moreover", "In conclusion", "Overall".
No hedging padding like "it's worth mentioning" or "you might want to consider".
Don't neatly balance every answer with "on one hand... on the other hand" or
wrap up with a tidy summary sentence - real people just stop talking when
they're done. Don't force things into threes. Contractions always. Sentence
fragments are fine. Let your rhythm vary - short line, then a longer one, the
way people actually talk instead of a metronome.

If you do not know something, say so plainly. No hedging, no long caveat.
"""

[memory]
# Long-term memory lives as plain files you can read and edit: sessions/*.jsonl
# is the complete turn-by-turn record, facts.md is the distilled part Clio
# carries between sessions, index.sqlite3 is a derived FTS index that can be
# deleted and rebuilt from the JSONL at any time. Not committed, see .gitignore.
root = "memory"
recent_turns_on_start = 8   # prior turns pulled back in so a restart isn't amnesia
recall_hits = 4             # past turns retrieved per question - keep small, they cost context
prewarm = true              # load STT + TTS in the background at startup. They are lazy by
                            # design, but paying for both on the first request cost ~7s in the
                            # first live test. false trades responsiveness for a lighter idle GPU.
consolidate = true          # at the end of a conversation, distil durable facts into facts.md
                            # (one fast-tier call, skipped entirely if the conversation
                            #  never needed the LLM - so timers stay free)

[location]
# Used only for weather, and only once you fill it in. Both coordinates left at
# zero means Clio says she doesn't know where you are rather than guessing from
# your IP address - these are the only personal details any utility sends out.
name = ""                 # spoken aloud: "It's 21 degrees in Mumbai"
latitude = 0.0
longitude = 0.0

[runtime]
log_level = "INFO"        # DEBUG | INFO | WARNING | ERROR
core_port = 8765
